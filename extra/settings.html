<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var s=JSON.parse(localStorage.getItem('portfolio_settings_v1')||'{}');if(s.theme==='dark')document.documentElement.classList.add('dark');var cn=parseInt(s.cursor,10);if(cn>=1&&cn<=3){var bp=location.pathname.indexOf('/Portfolio_2_Mock/')!==-1?'/Portfolio_2_Mock':'';var pad=cn<10?'0'+cn:''+cn;var el=document.getElementById('settings-cursor-style');if(!el){el=document.createElement('style');el.id='settings-cursor-style';document.head.appendChild(el);}el.textContent='*{cursor:url("'+bp+'/extra/assets/cursors/arrow-'+pad+'.cur"),default!important;}a,button,.nav-collapsible-trigger,[role="button"],[tabindex]:not([tabindex="-1"]){cursor:url("'+bp+'/extra/assets/cursors/hover-'+pad+'.cur"),pointer!important;}'}}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/styles.css">
  <title>Settings</title>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main>
    <div class="projects-container">
      <p class="about-heading">Settings</p>
      <p class="about-text">Some extra settings to make the site more enjoyable.</p>

      <div class="settings-section">
        <p class="about-text bold">Lighting:</p>
        <div class="settings-controls">
          <button class="setting-btn" data-setting="theme" data-value="light">light</button>
          <button class="setting-btn" data-setting="theme" data-value="dark">dark</button>
        </div>
      </div>

      <div class="settings-section">
        <p class="about-text bold">Cursor:</p>
        <div class="settings-controls">
          <button class="setting-btn" data-setting="cursor" data-value="1">1</button>
          <button class="setting-btn" data-setting="cursor" data-value="2">2</button>
          <button class="setting-btn" data-setting="cursor" data-value="3">3</button>
          <button class="setting-btn" data-setting="cursor" data-value="0">4</button>
        </div>
      </div>

      <div class="settings-section">
        <p class="about-text bold">Ambient nature sounds:</p>
        <div class="settings-controls">
          <button class="setting-btn" data-setting="ambient" data-value="on">on</button>
          <button class="setting-btn" data-setting="ambient" data-value="off">off</button>
        </div>
      </div>

      <div class="settings-section">
        <p class="about-text bold">Dachshund:</p>
        <div class="settings-controls">
          <button class="setting-btn" data-setting="dachshund" data-value="on">on</button>
          <button class="setting-btn" data-setting="dachshund" data-value="off">off</button>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/include-nav.js"></script>
  <script src="../js/effects.js"></script>
  <script src="../js/analytics.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
