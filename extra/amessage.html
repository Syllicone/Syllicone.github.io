  <style>

    #login-wrapper {
      display: flex;
      flex-direction: column;

    #pwd-input {

    .btn-row {

    .terminal-btn {

      border-left: 1px solid #ffffff;
      border-right: 1px solid #808080;

      font-size: 15px;
      padding: 2px 16px;
      cursor: pointer;
      color: #000;

    .terminal-btn:active {
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    #hint-window {
      display: none;
      border: 1px solid #999;
      font-family: Consolas, monospace;
      font-size: 13px;
      padding: 8px 14px;
      color: #333;
      margin-top: 4px;
      text-align: center;
    }

    #hint-window::before {
      content: 'hint: ';
      color: #999;
    }

    #status-line {
      font-size: 13px;
      min-height: 18px;
      text-align: center;
      transition: opacity 1s ease;
    }

    #status-line.error {
      color: #c00;
    }

    #status-line.fade {
      opacity: 0;
    }

    #message-wrapper {
      display: none;
      width: 100%;
      align-self: flex-start;
    }

</head>
<body>
  <div id="nav-placeholder"></div>

  <main>
    <!-- LOGIN -->
    <div id="login-wrapper">
      <div class="password-row">
        <label for="pwd-input">Password:</label>
        <input type="password" id="pwd-input" autocomplete="off" autofocus spellcheck="false">
      </div>
      <div class="btn-row">
        <button class="terminal-btn" onclick="attempt()">Enter</button>
        <button class="terminal-btn" onclick="toggleHint()">Hint</button>
      </div>
      <div id="hint-window"></div>
      <div id="status-line"></div>
    </div>

    <span id="unlock-track" data-track="A message unlocked" hidden aria-hidden="true"></span>

    <!-- MESSAGE (revealed on correct password) -->
    <div id="message-wrapper">
      <div class="projects-container">
        <p class="about-heading">A Message</p>
        <p class="about-text" id="msg-body"></p>
      </div>
    </div>
  </main>

  <script src="../js/include-nav.js"></script>
  <script src="../js/effects.js"></script>
  <script src="../js/analytics.js"></script>
  <script>
    // ─────────────────────────────────────────────────────────────

    //      encryptMessage('password1', 'Your message here...');
    //      encryptMessage('password2', 'Your message here...');
    //    (The message must be identical each time.)
    //
    // 2. Paste each resulting { iv, data } object into the STORED array below.
    //
    // 3. Replace HINT with your hint text.
    //
    // 4. Delete (or comment out) the encryptMessage helper once done.
    // ─────────────────────────────────────────────────────────────

    // Add one { iv, data } entry per password — all encrypting the same message.
    const STORED = [
    {"iv":"V1p4J4+/UiHhRjiQ","data":"FHtc+nbvWHQTBaXNbny75M4SQU14r2APhcpZTRzEDF5PgKFHf6h1v3K+lfTfQUyZv6OInRMjXYQTwh29BRp4KlzIRKsh1UFbRcWjsBXcEtv8h5UrTS1QgsROV0shna2dW+IoB5qaqBGPACBz/OJ2o4D1i0qksLhwNxdQ4cbjSJMGWNnTSWAp5SGGZQ8SoShDKmLuGgeA1Qw2pmXBUGn+WLX40HhtDtPNGVo54vZ2/IprN4nXIaiHGVNQEPC2sEQPr5sFHg2zbtgeT9wpHHyWSC3xWRMJUUzPucoWjtiT+c8gVMqDw/Rh6w12FDq1jUrbCwo0MZF1G7QwT/vcHC1xXx62ao+VbllXdmqjx+GLXhTKiYlN9mZjLemsQpLdFE2w48Zw7lZpSQnTCswKG/WHj2X9JqEB+JBmuIhwyB616Xo29QO0BkXeFqmtAgcNR9NLXYVwPqVm3Pbm6ax0HK75JPI89t6xczZRaA9AAHDzkSxA0fH94xhjwxsHCx90OVg8NuvDIfBfq8azjN0+rKbNNnOXRSTQhKrzCP+P9eBeTfVofqGn3yKzx/zt4x7AVc/m8IUHRpHJptLF5UT8g6j0btpJDAsftxxkfpGv6GPW1194DQGhrsJeJFoMirFfLFg5kPCthy7pmqxZ7aFhuJSuAw=="},
    {"iv":"bjnNjc4cmTZsbfLy","data":"3LDa8uvFpGn1RKqoWcLU3Tr80YydvCEs+rY6I2fROwzqwAOnFvOlKZ6CEfNLyUGc+wN375BWAs90REvdvaErLDUsvQ1T5Fo5UBs12ib08sxTejOE0jFm25To6ftZtfQWNLupQcSR8pAaMgb4ljoAxEV3DUhYdbbbHJ7tZYqBqpW7wFOkHDMs8HVLyCn/IMj6wCSMK6oGa4u91O3zu4+KT9FkKjFQmhsxyYmdFs45Oa5l5baMu+4HWDRfdEmOZkIZn+Qk0FWUdKMWzdKKScTpXIaOvTHa9Wu/7JXH9TYpFxIaac154EavieJlpa/FfYEdfYQcPoh7jbc0iPZHKe7zG+ukPoM46H0QkP5IjVVju0etRhNrHyr7zFmgLKIbNYHvdAROGg+xOtrkLBxOxyhD/N6oumE/hntaowOi9qX9oUPTLo38DJshv6tWrey+zfNzyYxpnShPL5pDQWuvyiznoSBCSIvBkCxcCwfQxkDpQ1FQE6vsAiDI3N+gRtwBuyGsklu8nd4XG3flbEZsB9ZzmtoDv1U/Q6Y00SMCBuB5O8L0JjGFIFjGWIGsc+IrMB09PWs3klr4TKriQVc60+wlW/ONdXjLmB3vCa1eQiZoSzusQ2739KUagjmievbFrpFkXM0iiLtHczabAVkvhbLm3w=="}
  ];

    const HINT = 'A gentleman carrot with a case, no caps'; // set your hint text here

    // ── Crypto helpers ──────────────────────────────────────────

    const SALT = 'ds-message-salt-v1';

    async function deriveKey(password) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: enc.encode(SALT), iterations: 200000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function decrypt(stored, password) {
      const key = await deriveKey(password);
      const iv   = Uint8Array.from(atob(stored.iv),   c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(stored.data), c => c.charCodeAt(0));
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return new TextDecoder().decode(plain);
    }

    // ── Run this ONCE in the console to generate your ciphertext ──
    // encryptMessage('yourpassword', 'Your message here...');

    async function encryptMessage(password, message) {
      const enc = new TextEncoder();
      const key = await deriveKey(password);
      const iv  = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv }, key, enc.encode(message)
      );
      const result = {
        iv:   btoa(String.fromCharCode(...iv)),
        data: btoa(String.fromCharCode(...new Uint8Array(encrypted)))
      };
      console.log('Paste this into STORED array:\n', JSON.stringify(result));
      return result;
    }

    // ── UI ───────────────────────────────────────────────────────

    document.getElementById('pwd-input')
      .addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });

    let hintVisible = false;

    function toggleHint() {
      const h = document.getElementById('hint-window');
      if (hintVisible) {
        h.style.display = 'none';
        hintVisible = false;
      } else {
        h.textContent = HINT;
        h.style.display = 'block';
        hintVisible = true;
      }
    }

    let fadeTimer = null;

    function showError(msg) {
      const status = document.getElementById('status-line');
      if (fadeTimer) clearTimeout(fadeTimer);
      status.classList.remove('fade');
      status.className = 'error';
      status.style.opacity = '1';
      status.textContent = msg;
      fadeTimer = setTimeout(() => {
        status.classList.add('fade');
        fadeTimer = setTimeout(() => {
          status.textContent = '';
          status.className = '';
          status.style.opacity = '1';
        }, 1000);
      }, 3000);
    }

    async function attempt() {
      if (!STORED || STORED.length === 0) {
        showError('Setup incomplete — no ciphertext stored');
        return;
      }

      const pwd = document.getElementById('pwd-input').value;
      if (!pwd) return;

      for (const entry of STORED) {
        try {
          const message = await decrypt(entry, pwd);
          document.getElementById('login-wrapper').style.display = 'none';
          document.getElementById('message-wrapper').style.display = 'block';
          document.getElementById('msg-body').textContent = message;
          document.getElementById('unlock-track')?.click();
          return; // success — stop trying
        } catch {
          // this entry didn't match — try the next one
        }
      }

      // none of the entries decrypted successfully
      showError('Incorrect password');
      document.getElementById('pwd-input').value = '';
      document.getElementById('pwd-input').focus();
    }
  </script>
</body>
</html>
